[package]
name = "frontmatter-gen-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.frontmatter-gen]
path = ".."

# The harness is its own workspace so nightly + sanitizer flags never
# leak into the main build.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_extract"
path = "fuzz_targets/fuzz_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false
