# -----------------------------------------------------------------------------
# FrontMatter Gen - A Rust library for generating and parsing frontmatter in various formats.
# -----------------------------------------------------------------------------

[package]
name = "frontmatter-gen"
version = "0.0.11"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
description = """
A Rust library for generating and parsing frontmatter in various formats.
"""
homepage = "https://frontmatter-gen.com/"
documentation = "https://frontmatter-gen.com/documentation/index.html"
repository = "https://github.com/sebastienrousseau/frontmatter-gen"
readme = "README.md"

# -----------------------------------------------------------------------------
# Crate Configuration
# -----------------------------------------------------------------------------
categories = [
    "command-line-utilities",
    "data-structures",
    "text-processing",
    "parsing",
    "development-tools"
]

# Keywords for easier discoverability on Crates.io.
keywords = ["frontmatter", "yaml", "toml", "json", "frontmatter-gen"]

# Excluding unnecessary files from the package
exclude = [
    "/.git/*",                          # Exclude version control files
    "/.github/*",                       # Exclude GitHub workflows
    "/.gitignore",                      # Ignore Git ignore file
    "/.vscode/*"                        # Ignore VSCode settings
]

# Including necessary files in the package
include = [
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
]

# -----------------------------------------------------------------------------
# Library Information
# -----------------------------------------------------------------------------

# The library file that contains the main logic for the binary.
[lib]
name = "frontmatter_gen"
path = "src/lib.rs"

# The main file that contains the entry point for the binary.
[[bin]]
name = "fmg"
path = "src/main.rs"
required-features = ["cli"]

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
# Optional features that can be enabled or disabled.
default = []                            # SSG is not enabled by default
cli = ["dep:clap"]                      # CLI functionality only
ssg = [                                 # Full SSG functionality
    "cli",                              # Include CLI as part of SSG
    "dep:tera",
    "dep:pulldown-cmark",
    "dep:dtt",
    "dep:url",
]

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------

[dependencies]
# Core dependencies
anyhow = "1.0.95"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
noyalib = { version = "=0.0.37", default-features = false, features = ["std"] }
time = { version = "0.3.36", features = ["formatting", "local-offset"] }
tokio = { version = "1.44", features = ["full"] }

thiserror = "2.0.3"
toml = "1.1.2"
uuid = { version = "1.15", features = ["v4", "serde"] }

# Optional logging (only included when "logging" feature is enabled)
log = "0.4.22"

# Optional CLI and SSG dependencies - all must have optional = true
clap = { version = "4.5.21", features = ["derive"], optional = true }
dtt = { version = "0.0.11", optional = true }
pulldown-cmark = { version = "0.13.4", optional = true }
tera = { version = "2", optional = true }
url = { version = "2.5.4", optional = true }

# -----------------------------------------------------------------------------
# Development Dependencies
#
# Test, example and benchmark support. These do not reach consumers.
# -----------------------------------------------------------------------------

[dev-dependencies]
criterion = "0.8"           # Benchmark harness for benches/
env_logger = "0.11.5"       # Examples that demonstrate logging
tempfile = "3.14.0"         # Temporary directories in tests

# -----------------------------------------------------------------------------
# Build Dependencies
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Benchmarks
# -----------------------------------------------------------------------------

# Criterion provides its own harness; libtest's would collect zero tests
# and report success, which is how this bench silently ran nothing.
[[bench]]
name = "frontmatter_benchmark"
path = "benches/frontmatter_benchmark.rs"
harness = false
